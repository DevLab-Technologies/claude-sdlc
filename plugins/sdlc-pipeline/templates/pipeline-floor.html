<meta charset="utf-8">
<!-- Without this, a phone lays the page out at 980px and scales the result down:
     the floor becomes a postage stamp, the gate rail runs off the edge, and the
     760px breakpoint below never fires. viewport-fit=cover pairs with the
     safe-area padding on the footer. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipeline Floor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Archivo+Expanded:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen&display=swap">
<style>
  :root {
    --floor: #171f2b;
    --floor-line: #212c3c;
    --wall: #10161f;
    --panel: #131b26;
    --panel-line: #22303f;
    --desk: #2b3a4d;
    --desk-top: #364a63;
    --ink: #dce6f0;
    --ink-dim: #7c8ba0;
    --ink-faint: #4c5a6e;
    --signal: #ffb545;
    --signal-dim: #8a6127;
    --ok: #5fd3a0;
    --warn: #ffb545;
    --bad: #ff6b6b;
    /* Waiting on somebody. Deliberately not the working amber and not the bad
       red: a blocked desk is neither busy nor broken, and a reader has to be
       able to tell it from both at a glance across the whole floor. */
    --ask: #b9a2ff;
    --ask-dim: #6f5fbf;
    --idle: #46536a;
    --skin: #e6b98c;

    --font-display: "Archivo Expanded", "Archivo", sans-serif;
    --font-ui: "Archivo", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    --font-pixel: "Silkscreen", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--wall);
    color: var(--ink);
    font-family: var(--font-ui);
    height: 100%;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    /* dvh, not vh: mobile Safari counts its collapsing toolbars in vh, which
       pushed the controls under the browser chrome. vh stays as the fallback
       for browsers without dvh. */
    height: 100vh;
    height: 100dvh;
    min-height: 480px;
  }

  /* The 480px floor above is there so a desktop window cannot crush the layout.
     On a landscape phone the viewport is genuinely shorter than that, and
     holding the floor open pushed the controls off the bottom of the screen. */
  @media (max-height: 520px) {
    body { min-height: 0; }
  }

  /* ---------- header ---------- */

  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-line);
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-right: auto;
  }

  .brand .mark {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.02em;
    color: var(--ink);
    white-space: nowrap;
  }

  .brand .mark span { color: var(--signal); }

  .brand .tag {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    border: 1px solid var(--panel-line);
    border-radius: 3px;
    padding: 2px 6px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .home-link {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-dim);
    text-decoration: none;
    border: 1px solid var(--panel-line);
    border-radius: 3px;
    padding: 3px 7px;
    white-space: nowrap;
    align-self: center;
  }

  .home-link:hover, .home-link:focus-visible { color: var(--signal); border-color: var(--signal-dim); outline: none; }
  .home-link[hidden] { display: none; }

  /* The feature this floor belongs to. It sits between the mark and the status
     tag and gives way first: the status is the one thing the header must never
     truncate. */
  .feature-name {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    max-width: 34vw;
  }

  .feature-name[hidden] { display: none; }
  .feature-name .kind { color: var(--ink-faint); text-transform: uppercase; font-size: 9.5px; letter-spacing: .05em; margin-right: 6px; }

  .gate-rail {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .gate-pill {
    flex: none;
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.03em;
    color: var(--ink-dim);
    background: var(--floor);
    border: 1px solid var(--panel-line);
    border-radius: 3px;
    padding: 4px 7px;
    white-space: nowrap;
    transition: color .3s, background .3s, border-color .3s;
  }

  /* A gate the track deliberately skipped, told apart from one not yet reached.
     Colour alone would not carry it — the dashed border and the strike survive
     both a monochrome screenshot and a colour-blind reader. */
  .gate-pill.skipped {
    color: var(--ink-faint);
    border-style: dashed;
    text-decoration: line-through;
    text-decoration-thickness: 1px;
  }

  .gate-pill.active {
    color: #1a1206;
    background: var(--signal);
    border-color: var(--signal);
    font-weight: 600;
  }

  .gate-pill.done {
    color: #0d2019;
    background: var(--ok);
    border-color: var(--ok);
  }

  .gate-pill.bad {
    color: #2a0d0d;
    background: var(--bad);
    border-color: var(--bad);
  }

  .cycle-badge {
    flex: none;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-dim);
    white-space: nowrap;
  }

  .cycle-badge b { color: var(--ink); }

  /* ---------- main split ---------- */

  main {
    flex: 1;
    display: flex;
    min-height: 0;
    /* Stacked on a phone, an over-tall floor would otherwise push the controls
       out from under the viewport. */
    overflow: hidden;
  }

  .floor-wrap {
    flex: 1 1 68%;
    position: relative;
    background: var(--wall);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    min-width: 0;
  }

  canvas#floor {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    width: 100%;
    height: auto;
    aspect-ratio: 8 / 5;
    max-width: 1040px;
    max-height: 100%;
    background: var(--floor);
    border: 1px solid var(--panel-line);
    border-radius: 2px;
  }

  .floor-caption {
    position: absolute;
    left: 22px;
    bottom: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-dim);
    background: rgba(19, 27, 38, .82);
    border: 1px solid var(--panel-line);
    border-radius: 3px;
    padding: 6px 10px;
    max-width: 60%;
  }

  .floor-caption b { color: var(--signal); font-weight: 600; }

  aside {
    flex: 1 1 32%;
    max-width: 380px;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--panel-line);
    min-height: 0;
  }

  .panel-block {
    border-bottom: 1px solid var(--panel-line);
    padding: 12px 14px;
  }

  /* The right-now block grows with its rows up to a share of the panel, then
     scrolls inside itself. The label, the summary line and the sign-off card
     stay pinned; only the questions and the running rows move. Nothing is cut:
     the fortieth agent is one scroll away rather than pushing the board, the
     roster and the feed below the fold. */
  .panel-block.now-block {
    display: flex;
    flex-direction: column;
    flex: 0 1 auto;
    min-height: 0;
    max-height: 42%;
  }

  .now-block .panel-label, .now-block .current-line, .now-block .signoff-card { flex: none; }

  .now-scroll {
    flex: 0 1 auto;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--panel-line) transparent;
    /* Room for the scrollbar so a row's clock is never under it. */
    padding-right: 2px;
  }

  .panel-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .panel-label .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 6px var(--ok);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse { 50% { opacity: .35; } }

  .current-line {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink);
    line-height: 1.5;
  }

  .current-line .who { color: var(--signal); font-weight: 600; }

  .signoff-card {
    display: none;
    border: 1px solid var(--signal-dim);
    background: linear-gradient(180deg, rgba(255,181,69,.08), rgba(255,181,69,.02));
    border-radius: 3px;
    padding: 9px 10px;
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.55;
    color: var(--ink-dim);
  }

  .signoff-card.show { display: block; }

  .signoff-card .k { color: var(--signal); font-weight: 600; }

  .ticker {
    flex: none;
    padding: 10px 14px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.7;
    scrollbar-width: thin;
    scrollbar-color: var(--panel-line) transparent;
  }

  .ticker-row {
    display: grid;
    /* 46px clipped the last digit of a HH:MM:SS stamp at this font size. */
    grid-template-columns: 52px 12px minmax(0, 1fr);
    gap: 7px;
    color: var(--ink-dim);
    opacity: 0;
    animation: rowIn .35s ease-out forwards;
  }

  @keyframes rowIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

  .ticker-row .t { color: var(--ink-faint); }
  /* Day divider — the feed carries the times events actually happened, so a
     backlog loaded at once can cross midnight or span days. Without this, 23:59
     followed by 00:02 reads as a clock that went backwards. */
  .ticker-day {
    color: var(--ink-faint);
    letter-spacing: .08em;
    margin: 6px 0 2px;
    opacity: .75;
  }
  .ticker-row .b { text-align: center; }
  .ticker-row .b.start::before { content: "▸"; color: var(--warn); }
  .ticker-row .b.done::before { content: "✓"; color: var(--ok); }
  .ticker-row .b.bad::before { content: "✕"; color: var(--bad); }
  .ticker-row .b.note::before { content: "·"; color: var(--ink-faint); }
  /* Artifact paths and issue ids have no spaces to break on, so a long
     run_complete line would otherwise widen the whole feed. */
  .ticker-row .m { color: var(--ink); overflow-wrap: anywhere; }
  .ticker-row .m .agent { color: var(--signal); }
  .ticker-row.sev-bad .m { color: var(--bad); }
  .ticker-row.sev-warn .m { color: var(--warn); }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .stat {
    background: var(--floor);
    border: 1px solid var(--panel-line);
    border-radius: 3px;
    padding: 8px 8px 7px;
    text-align: center;
  }

  .stat .n {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .stat.bad .n { color: var(--bad); }
  .stat.ok .n { color: var(--ok); }

  .stat .l {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ---------- now / board / roster ---------- */

  /* The panel scrolls as one column; the pinned blocks stay put and only the
     selected tab's body moves. */
  .panel-scroll {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .tabs {
    flex: none;
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--panel-line);
  }

  .tab {
    flex: 1;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 9px 4px;
    cursor: pointer;
    /* The gaps tab carries a count, and a phone gives four tabs about 80px
       each. Truncate the label rather than let it wrap and shove the row two
       lines tall. */
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tab:hover { color: var(--ink-dim); }
  .tab:focus-visible { outline: 2px solid var(--signal); outline-offset: -2px; }
  .tab[aria-selected="true"] { color: var(--signal); border-bottom-color: var(--signal); }

  .tab-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--panel-line) transparent;
  }

  .tab-body[hidden] { display: none; }

  .rows { padding: 10px 14px; font-family: var(--font-mono); font-size: 11.5px; }

  .rows .group-label {
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 4px 0 6px;
  }

  .rows .group-label:not(:first-child) { margin-top: 14px; }

  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px 8px;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,.04);
  }

  .row .name { color: var(--ink); overflow-wrap: anywhere; }
  .row .meta {
    grid-column: 1 / -1;
    color: var(--ink-faint);
    font-size: 10.5px;
    overflow-wrap: anywhere;
  }
  .row .num { color: var(--ink-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .chip {
    font-size: 9.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid var(--panel-line);
    color: var(--ink-faint);
    background: var(--floor);
    white-space: nowrap;
  }

  .chip.working { color: #1a1206; background: var(--signal); border-color: var(--signal); }
  .chip.done    { color: #0d2019; background: var(--ok); border-color: var(--ok); }
  .chip.bad     { color: #2a0d0d; background: var(--bad); border-color: var(--bad); }
  .chip.queued  { color: var(--signal); border-color: var(--signal-dim); background: transparent; }
  .chip.blocked { color: #140d2a; background: var(--ask); border-color: var(--ask); }

  /* A running desk's own clock. It ticks off the recorded phase_start, so it is
     elapsed time, not an animation. */
  .now-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 4px 0;
  }

  .now-row .who { color: var(--signal); font-weight: 600; }
  .now-row.blocked .who { color: var(--ask); }
  .now-row.blocked .el { color: var(--ask); }

  /* The pipeline has stopped and a person is the only thing that can restart it.
     This sits above the running list because it outranks it: a reader who takes
     one thing from the panel must take this. */
  .waiting-card {
    display: none;
    border: 1px solid var(--ask-dim);
    background: linear-gradient(180deg, rgba(185,162,255,.10), rgba(185,162,255,.02));
    border-radius: 3px;
    padding: 9px 10px;
    margin: 10px 0;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink);
    line-height: 1.5;
  }
  .waiting-card.show { display: block; }
  .waiting-card .k {
    color: var(--ask);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 10px;
  }
  .waiting-card .q { display: block; margin-top: 4px; }
  .waiting-card .fold {
    display: block;
    margin-top: 8px;
    padding: 0;
    background: none;
    border: none;
    font: inherit;
    font-size: 10.5px;
    color: var(--ask);
    cursor: pointer;
    text-decoration: underline dotted;
  }
  .waiting-card .fold:hover, .waiting-card .fold:focus-visible { color: var(--ink); outline: none; }
  .waiting-card .folded[hidden] { display: none; }
  .waiting-card .src { color: var(--ink-faint); font-size: 10px; }
  .now-row .el { margin-left: auto; color: var(--ink); font-variant-numeric: tabular-nums; }
  .now-row .task { color: var(--ink-dim); }

  .empty-note { color: var(--ink-faint); font-style: italic; padding: 12px 14px; font-family: var(--font-mono); font-size: 11.5px; }

  /* The gaps pane is the floor's own disclosure — everything the derivation had
     to infer, everything the log contradicts itself about, and the caveats no
     log could ever settle. Grouped by kind, because a hundred loose sentences
     is a wall rather than a disclosure, and coloured by nature so a logging
     defect somebody can fix is never mistaken for a permanent limit. */
  .chip.unresolved  { color: var(--bad); border-color: var(--bad); background: transparent; }
  .chip.derived     { color: var(--signal); border-color: var(--signal-dim); background: transparent; }
  .chip.irreducible { color: var(--ink-faint); border-color: var(--panel-line); background: transparent; }

  .gap-line {
    color: var(--ink-faint);
    font-size: 10.5px;
    line-height: 1.45;
    padding: 3px 0 3px 9px;
    margin: 2px 0 0;
    border-left: 1px solid var(--panel-line);
    overflow-wrap: anywhere;
  }

  /* ---------- controls ---------- */

  footer {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    background: var(--panel);
    border-top: 1px solid var(--panel-line);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-dim);
    flex-wrap: wrap;
  }

  /* The footer carries readouts, not controls. There is nothing to play, pause
     or rewind: the floor only ever shows where the pipeline actually is. */
  .readout {
    display: flex;
    align-items: baseline;
    gap: 6px;
    white-space: nowrap;
  }

  .readout .k {
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .readout .v { color: var(--ink); font-variant-numeric: tabular-nums; }

  .proto-tag {
    margin-left: auto;
    color: var(--bad);
    border: 1px solid #5a2323;
    border-radius: 3px;
    padding: 4px 8px;
    font-size: 10px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  canvas#floor { cursor: default; }

  /* ---------- agent modal ---------- */

  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(8, 11, 16, 0.62);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
  }

  .modal-backdrop.show { display: flex; }

  .modal-card {
    width: 100%;
    max-width: 380px;
    max-height: 80vh;
    max-height: 80dvh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
  }

  .modal-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--panel-line);
  }

  .modal-head .who {
    flex: 1;
    min-width: 0;
  }

  .modal-head .who .id {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    word-break: break-word;
  }

  .modal-head .who .dept {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .modal-status {
    flex: none;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 3px;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .modal-status.st-working { color: #1a1206; background: var(--signal); }
  .modal-status.st-resting { color: #0d2019; background: var(--ok); }
  .modal-status.st-issue   { color: #2a0d0d; background: var(--bad); }
  .modal-status.st-blocked { color: #140d2a; background: var(--ask); }
  .modal-status.st-idle    { color: var(--ink-faint); background: var(--floor); border-color: var(--panel-line); }

  .modal-close {
    flex: none;
    background: transparent;
    border: none;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
  }

  .modal-close:hover { color: var(--ink); }

  .modal-now {
    padding: 12px 16px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink);
    border-bottom: 1px solid var(--panel-line);
  }

  .modal-now .label {
    display: block;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .modal-log {
    overflow-y: auto;
    padding: 10px 16px 14px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.7;
  }

  .modal-log .label {
    display: block;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  /* A run_complete can carry a paragraph of verification detail. Clamped, the
     log stays scannable and a click opens the entry in full — the same bargain
     the feed rows make on a narrow screen. */
  .modal-log .entry {
    color: var(--ink-dim);
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    cursor: pointer;
    margin-bottom: 6px;
  }

  .modal-log .entry.open { -webkit-line-clamp: unset; }

  .modal-log .entry.bad { color: var(--bad); }
  .modal-log .entry .b::before { content: "▸ "; color: var(--ink-faint); }
  .modal-log .entry.done .b::before { content: "✓ "; color: var(--ok); }
  .modal-log .entry.bad .b::before { content: "✕ "; color: var(--bad); }
  .modal-log .empty { color: var(--ink-faint); font-style: italic; }

  /* Stacked layout for anything phone-width. The floor keeps a legible desk
     size and scrolls sideways instead of shrinking to a thumbnail — a floor you
     cannot read is worth less than one you have to pan. */
  @media (max-width: 860px) {
    main { flex-direction: column; }

    header { gap: 10px; padding: 8px 12px; }
    .brand { margin-right: 0; flex: 1 1 100%; min-width: 0; }
    .gate-rail { order: 3; flex: 1 0 100%; }
    .cycle-badge { margin-left: auto; }

    .floor-wrap {
      flex: 0 0 auto;
      display: block;
      overflow-x: auto;
      padding: 8px;
      -webkit-overflow-scrolling: touch;
    }

    /* Width is derived, never pinned: a min-width plus a definite height would
       both be honoured and aspect-ratio dropped, stretching the pixel art. The
       floor takes the wider of the box it is in and the width its height cap
       implies (34dvh x 8/5), so it fills a tablet row and pans on a phone,
       always at 8:5. */
    canvas#floor {
      width: max(100%, calc(34dvh * 8 / 5));
      height: auto;
      max-height: none;
      aspect-ratio: 8 / 5;
    }

    /* Sticky, not absolute: the caption stays put while the floor pans under it. */
    .floor-caption {
      position: sticky;
      left: 0;
      bottom: auto;
      display: block;
      max-width: 100%;
      margin-top: 8px;
    }

    aside {
      max-width: none;
      min-width: 0;
      border-left: none;
      border-top: 1px solid var(--panel-line);
      flex: 1 1 auto;
      min-height: 0;
    }

    /* The brand tag carries a long status string; let it truncate rather than
       push the cycle badge off the edge. */
    .brand .tag {
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    /* Compact the fixed blocks so the feed — the part that actually changes —
       keeps the room it needs. */
    /* Stacked, the floor's height follows the viewport WIDTH (8:5 at
       width: max(100%, 34dvh*8/5)), so a short, wide window leaves the panel
       almost nothing. Squeezing a flex:1 tab body then collapses it to zero and
       the board, agents and feed become unreachable — there is no scroll to
       reach a box with no height. So the column scrolls as a whole here, and
       the tab body keeps a floor under it rather than absorbing the shortfall. */
    aside { overflow-y: auto; }
    .panel-scroll { flex: 0 0 auto; }
    .tab-body { min-height: 200px; }
    /* Stacked, the panel is the scroll container, so a percentage max-height on
       the block has nothing to be a percentage of. Bound the rows by the
       viewport instead. */
    .panel-block.now-block { max-height: none; flex: none; }
    .now-scroll { max-height: 38vh; max-height: 38dvh; }
    .feature-name { max-width: 100%; }

    .panel-block { padding: 9px 12px; }
    .current-line { font-size: 12px; }
    .stat { padding: 6px 6px 5px; }
    .stat .n { font-size: 15px; }
    .ticker { padding: 8px 12px; }
    .rows { padding: 8px 12px; }

    /* A single run_complete can carry a dozen artifact paths. Clamped, the feed
       stays scannable; tapping a line opens it in full. */
    .ticker-row .m {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
    }

    .ticker-row.open .m { -webkit-line-clamp: unset; }
  }

  /* A landscape phone is under 860px wide but has no height to spare, so
     stacking would leave the floor a sliver. Keep the split and let the panel
     narrow instead. */
  @media (max-width: 860px) and (orientation: landscape) and (max-height: 520px) {
    main { flex-direction: row; }
    .floor-wrap { flex: 1 1 60%; display: flex; overflow: hidden; padding: 8px; }
    /* Fit the height instead of holding the portrait min-width: a floor wider
       than its box centres itself out of view in a flex container, and there is
       no vertical room to spare here anyway. */
    canvas#floor { width: auto; height: 100%; max-height: 100%; }
    /* Brand, rail and badge share one header row here: each wrapping to its own
       row costs a third of the viewport in the one orientation with no height
       to spare. The rail scrolls inside its share of the row. */
    .brand { flex: 0 1 auto; max-width: 40%; min-width: 0; margin-right: 8px; }
    /* basis 0, not auto: the rail's content is far wider than the row, so an
       auto basis makes it wrap instead of shrinking and scrolling in place. */
    .gate-rail { order: 0; flex: 1 1 0; min-width: 0; }
    .cycle-badge { margin-left: 0; }
    .floor-caption { position: absolute; left: 12px; bottom: 12px; margin-top: 0; max-width: 55%; }
    aside { flex: 1 1 40%; min-height: 0; min-width: 220px;
            border-top: none; border-left: 1px solid var(--panel-line); }
    .panel-block { padding: 7px 10px; }
  }

  /* Touch targets: 11px buttons with 6px padding are under every thumb-size
     guideline, and the floor has only three controls to grow. */
  @media (pointer: coarse) {
    .tab { padding: 12px 4px; font-size: 11px; }
    .modal-close { padding: 6px 10px; }
  }


  @media (prefers-reduced-motion: reduce) {
    .panel-label .dot { animation: none; }
    .ticker-row { animation: none; opacity: 1; }
  }
</style>

<header>
  <div class="brand">
    <!-- Shown only when this floor is one of several served from a home
         screen: the page fetches its state relative to its own URL, so a floor
         mounted at /f/<slug>/ has the home two levels up. -->
    <a class="home-link" id="homeLink" href="../../" hidden aria-label="Back to all features">&larr; all</a>
    <div class="mark">PIPELINE <span>FLOOR</span></div>
    <div class="feature-name" id="featureName" hidden></div>
    <div class="tag" id="brandTag">connecting&hellip;</div>
  </div>
  <div class="gate-rail" id="gateRail"></div>
  <div class="cycle-badge">cycle <b id="cycleNum">1</b></div>
</header>

<main>
  <div class="floor-wrap">
    <canvas id="floor" width="960" height="600"></canvas>
    <div class="floor-caption" id="floorCaption">warming up the floor&hellip;</div>
  </div>

  <aside>
    <div class="panel-block now-block">
      <p class="panel-label"><span class="dot"></span>right now</p>
      <div class="current-line" id="currentLine">waiting for the first event</div>
      <!-- The questions and the running rows scroll together inside a block
           that never takes more than its share of the panel. Forty concurrent
           agents used to push the board, the roster and the feed off the bottom
           of the screen; every row is still here, it just scrolls. -->
      <div class="now-scroll">
        <!-- Open questions, from the bus, the event log, intake's questions.md or
             state.json. Nothing in the run brackets records these, which is why a
             stopped pipeline used to read as a working one. -->
        <div class="waiting-card" id="waitingCard"></div>
        <!-- One row per agent with an open phase_start, each with its own elapsed
             clock counting from the timestamp that agent recorded. -->
        <div id="nowList"></div>
      </div>
      <div class="signoff-card" id="signoffCard">
        <span class="k">NOT verified —</span> <span id="signoffText"></span>
      </div>
    </div>

    <div class="panel-block">
      <div class="stat-grid">
        <div class="stat"><div class="n" id="statBlocker">0</div><div class="l">blocker</div></div>
        <div class="stat"><div class="n" id="statMajor">0</div><div class="l">major</div></div>
        <div class="stat ok"><div class="n" id="statVerified">0</div><div class="l">verified</div></div>
      </div>
    </div>

    <div class="panel-scroll">
      <div class="tabs" role="tablist">
        <button class="tab" id="tabBoard" role="tab" aria-selected="true" aria-controls="paneBoard">board</button>
        <button class="tab" id="tabAgents" role="tab" aria-selected="false" aria-controls="paneAgents">agents</button>
        <button class="tab" id="tabFeed" role="tab" aria-selected="false" aria-controls="paneFeed">feed</button>
        <button class="tab" id="tabGaps" role="tab" aria-selected="false" aria-controls="paneGaps">gaps</button>
      </div>

      <!-- What the work is and what is left of it: the workplan tasks, then the
           gates still ahead and who runs them. Neither is derivable from the
           event log alone, which is why the builder reads both off disk. -->
      <div class="tab-body" id="paneBoard" role="tabpanel" aria-labelledby="tabBoard">
        <div class="rows" id="boardRows"></div>
      </div>

      <div class="tab-body" id="paneAgents" role="tabpanel" aria-labelledby="tabAgents" hidden>
        <div class="rows" id="agentRows"></div>
      </div>

      <div class="tab-body" id="paneFeed" role="tabpanel" aria-labelledby="tabFeed" hidden>
        <div class="ticker" id="ticker"></div>
      </div>

      <!-- What this floor cannot show honestly on its own. The builder files
           every gap under a kind and a nature; this pane prints them grouped, so
           the count leads and the detail is underneath rather than the other way
           round. -->
      <div class="tab-body" id="paneGaps" role="tabpanel" aria-labelledby="tabGaps" hidden>
        <div class="rows" id="gapRows"></div>
      </div>
    </div>
  </aside>
</main>

<footer>
  <span class="readout"><span class="k">elapsed</span><span class="v" id="outElapsed">—</span></span>
  <span class="readout"><span class="k">agent time</span><span class="v" id="outAgentTime">—</span></span>
  <span class="readout"><span class="k">tokens</span><span class="v" id="outTokens">—</span></span>
  <span class="readout"><span class="k">runs</span><span class="v" id="outRuns">—</span></span>
  <span class="proto-tag" id="protoTag">reading history/events.jsonl</span>
</footer>

<div class="modal-backdrop" id="agentModal">

    <div class="modal-head">

        <div class="id" id="modalId">—</div>
