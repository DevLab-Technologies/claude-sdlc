    </div>
    <div class="modal-now">
      <span class="label">right now</span>
      <span id="modalNow">—</span>
      <br><span class="label" style="margin-top:8px;">time worked</span>
      <span id="modalTime">—</span>
      <br><span class="label" style="margin-top:8px;">working on</span>
      <span id="modalTask">—</span>
      <br><span class="label" style="margin-top:8px;">tokens used</span>
      <span id="modalTokens">—</span>
    </div>
    <div class="modal-log">
      <span class="label">what it did this run</span>
      <div id="modalLog"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     ROSTER — desks, grouped by department, laid out on a grid.
     Coordinates are grid cells; the canvas is a fixed small
     resolution and scaled up by CSS for the pixel look.
     ============================================================ */

  var GATES = ["intake","research","product","design","figma-design","ux-audit","architecture",
               "test-plan","implementation","review","qa","ui-qa","release"];

  var DEPARTMENTS = [
    { id: "intake",  label: "INTAKE",     row: 0, col: 0, desks: [
      { id: "sdlc-intake", short: "INTAKE" }
    ]},
    { id: "research", label: "RESEARCH",  row: 0, col: 2, desks: [
      { id: "sdlc-researcher-findings",   short: "FINDINGS" },
      { id: "sdlc-researcher-prior-art",  short: "PRIOR-ART" },
      { id: "sdlc-researcher-constraints",short: "CONSTRNT" }
    ]},
    { id: "product", label: "PRODUCT",    row: 0, col: 6, desks: [
      { id: "sdlc-product-owner", short: "PRODUCT" }
    ]},
    { id: "design",  label: "DESIGN",     row: 0, col: 8, desks: [
      { id: "sdlc-ux-designer", short: "DESIGN" }
    ]},
    { id: "ux-audit", label: "UX AUDIT",  row: 2, col: 8, desks: [
      { id: "sdlc-ux-auditor", short: "UX-AUDIT" }
    ]},
    { id: "architecture", label: "ARCHITECTURE", row: 2, col: 6, desks: [
      { id: "sdlc-architect", short: "ARCHITECT" }
    ]},
    { id: "testplan", label: "TEST PLAN", row: 2, col: 3, desks: [
      { id: "sdlc-qa-functional", short: "QA-PLAN" }
    ]},
    { id: "implementation", label: "IMPLEMENTATION", row: 2, col: 0, desks: [
      { id: "sdlc-implementer-a", short: "IMPL-A" },
      { id: "sdlc-implementer-b", short: "IMPL-B" },
      { id: "sdlc-implementer-c", short: "IMPL-C" }
    ]},
    { id: "review", label: "REVIEW FLOOR", row: 4, col: 0, desks: [
      { id: "sdlc-review-lead",        short: "LEAD" },
      { id: "sdlc-code-reviewer",      short: "CORRECT" },
      { id: "sdlc-review-security",    short: "SECURITY" },
      { id: "sdlc-review-performance", short: "PERF" },
      { id: "sdlc-review-tests",       short: "TESTS" }
    ]},
    { id: "debugger", label: "DEBUG BENCH", row: 4, col: 6, desks: [
      { id: "sdlc-debugger", short: "DEBUG" }
    ]},
    { id: "qa", label: "QA / RELEASE", row: 4, col: 8, desks: [
      { id: "sdlc-qa-ui",         short: "UI-QA" },
      { id: "sdlc-release-gate",  short: "RELEASE" }
    ]}
  ];

  var TILE = 52;                 // grid cell size in canvas px (internal resolution)
  var ORIGIN_X = 52, ORIGIN_Y = 60;

  // Every desk carries two things that must not be conflated:
  //   state      — what is happening THIS instant (only meaningful while activeNow)
  //   completed / hasOpenIssue — sticky facts that persist once true, so a desk that
  //   finished its work keeps reading as "finished" instead of reverting to "never
  //   touched" the moment the script moves on. That collapse was the original bug.
  var DESKS = {};                // id -> {x,y,short,dept,state,activeNow,completed,hasOpenIssue}
  var DEPT_LABELS = [];

  // Spread multipliers: the department grid (col 0-8, row 0-4) is deliberately
  // sparse so desks read as distinct floor zones with real walkways between them,
  // rather than clustering in one corner of the canvas.
  var SPREAD_X = 1.6, SPREAD_Y = 1.85;

  DEPARTMENTS.forEach(function (dept) {
    var perRow = 3;
    dept.desks.forEach(function (d, i) {
      var dx = i % perRow, dy = Math.floor(i / perRow);
      var x = ORIGIN_X + (dept.col * SPREAD_X + dx * 1.3) * TILE;
      var y = ORIGIN_Y + (dept.row * SPREAD_Y + dy * 1.3) * TILE;
      DESKS[d.id] = { x: x, y: y, short: d.short, dept: dept.id, label: d.short,
        state: "idle", activeNow: false, completed: false, hasOpenIssue: false, blocked: false,
        blockedWhy: null, waitingOn: null, log: [], totalRealMs: 0, liveSince: null, lastGate: null };
    });
    DEPT_LABELS.push({ x: ORIGIN_X + dept.col * SPREAD_X * TILE, y: ORIGIN_Y + dept.row * SPREAD_Y * TILE - 20, text: dept.label });
  });

  // Ticker lines address agents by a short form ("review-lead", "code-reviewer").
  // Map every such form back to its desk id so a click on a desk can show the
  // lines that were actually about it.
  var WHO_TO_DESK = {};
  Object.keys(DESKS).forEach(function (id) { WHO_TO_DESK[id.replace(/^sdlc-/, "")] = id; });
  WHO_TO_DESK["research-findings"] = "sdlc-researcher-findings";
  WHO_TO_DESK["research-prior-art"] = "sdlc-researcher-prior-art";
  WHO_TO_DESK["research-constraints"] = "sdlc-researcher-constraints";

  var ROLE_TINT = {
    "sdlc-intake": "#6fa8ff",
    "sdlc-researcher-findings": "#6fd6c9", "sdlc-researcher-prior-art": "#6fd6c9", "sdlc-researcher-constraints": "#6fd6c9",
    "sdlc-product-owner": "#c98bf0",
    "sdlc-ux-designer": "#f08bd0", "sdlc-ux-auditor": "#f08bd0",
    "sdlc-architect": "#8bb4f0",
    "sdlc-qa-functional": "#f0c98b",
    "sdlc-implementer-a": "#9ad17a", "sdlc-implementer-b": "#9ad17a", "sdlc-implementer-c": "#9ad17a",
    "sdlc-review-lead": "#ffb545", "sdlc-code-reviewer": "#7a9ad1", "sdlc-review-security": "#e06a6a",
    "sdlc-review-performance": "#e0b06a", "sdlc-review-tests": "#7ad1c4",
    "sdlc-debugger": "#d17a9a",
    "sdlc-qa-ui": "#f0c98b", "sdlc-release-gate": "#ffd76a"
  };

  /* ============================================================
     SCRIPT — the feature's real history, as steps.

     Filled by build-floor.mjs from history/events.jsonl: fetched
     once from state.json for a static snapshot, or streamed over
     SSE so the floor follows the pipeline as it runs. Nothing here
     is hand-written, and nothing loops — the end of SCRIPT means
     the log has no further events yet.

     A step's "real" is a {deskId: ms} map of what each agent
     actually recorded, and its contribution to the phase total is
     the largest of them, never the sum: concurrent desks waited
     once, together. Summing parallel durations and calling the
     result elapsed time is the mistake /sdlc-timing also exists to
     avoid. There is no second, on-screen duration — the floor does
     not pace anything, because it does not replay anything.
     ============================================================ */

  var SCRIPT = [];

  /* ============================================================
     DRIVER
     ============================================================ */

  var canvas = document.getElementById("floor");
  var ctx = canvas.getContext("2d");

  // Built once — every argument is a constant derived from the canvas's fixed
  // dimensions, so there is nothing here for a per-frame rebuild to buy.
  var vignetteGrad = ctx.createRadialGradient(
    canvas.width / 2, canvas.height / 2, canvas.height * 0.28,
    canvas.width / 2, canvas.height / 2, canvas.width * 0.72
  );
  vignetteGrad.addColorStop(0, "rgba(0,0,0,0)");
  vignetteGrad.addColorStop(1, "rgba(0,0,0,0.4)");
  var gateRailEl = document.getElementById("gateRail");
  var tickerEl = document.getElementById("ticker");
  var tickerDay = null;   // last day printed in the feed, for the day divider
  var currentLineEl = document.getElementById("currentLine");
  var floorCaptionEl = document.getElementById("floorCaption");
  var cycleNumEl = document.getElementById("cycleNum");
  var signoffCard = document.getElementById("signoffCard");
  var signoffText = document.getElementById("signoffText");
  var statBlocker = document.getElementById("statBlocker");
  var statMajor = document.getElementById("statMajor");
  var statVerified = document.getElementById("statVerified");

  GATES.forEach(function (g) {
    var pill = document.createElement("span");
    pill.className = "gate-pill";
    pill.dataset.gate = g;
    pill.textContent = g;
    gateRailEl.appendChild(pill);
  });

  var nowListEl = document.getElementById("nowList");
  var waitingCardEl = document.getElementById("waitingCard");
  var boardRowsEl = document.getElementById("boardRows");
  var agentRowsEl = document.getElementById("agentRows");
  var gapRowsEl = document.getElementById("gapRows");
  var tabGapsEl = document.getElementById("tabGaps");
  var outElapsed = document.getElementById("outElapsed");
  var outAgentTime = document.getElementById("outAgentTime");
  var outTokens = document.getElementById("outTokens");
  var outRuns = document.getElementById("outRuns");

  var stepIndex = -1;
  var stream = null;
  var lastState = null;
  var raf = null;
  var hoveredDesk = null;
  var phaseTotals = {};
  var rosterByDesk = {};        // desk id -> the builder's roster row
  var upNextDesks = {};         // desk id -> true, for the gate that runs next
  var modalDeskId = null;       // open modal's desk, so its clock can keep ticking
  // A static snapshot is a moment in the past. Its clocks stay where they were:
  // a counter ticking upward on a file built last week claims a run is still
  // going, which is exactly the false signal the header is careful not to give.
  var snapshotMode = false;

  // Same day/hour/minute/second/ms rule the real /sdlc-timing report uses: at most
  // two units, largest first, second dropped when zero, ms only under one second.
  function fmtDuration(ms) {
    if (!(ms > 0)) return "0s";
    if (ms < 1000) return Math.round(ms) + "ms";
    var s = Math.round(ms / 1000);
    if (s < 60) return s + "s";
    var m = Math.floor(s / 60); s = s % 60;
    if (m < 60) return s ? (m + "m " + s + "s") : (m + "m");
    var h = Math.floor(m / 60); m = m % 60;
    if (h < 24) return m ? (h + "h " + m + "m") : (h + "h");
    var d = Math.floor(h / 24); h = h % 24;
    return h ? (d + "d " + h + "h") : (d + "d");
  }

  // Tokens are reported, never estimated: null means no run_usage event carried a
  // figure, and that is said in those words rather than shown as a zero.
  function fmtTokens(n) {
    if (typeof n !== "number") return "not reported";
    if (n < 1000) return String(n);
    if (n < 1000000) return (n / 1000).toFixed(n < 10000 ? 1 : 0) + "k";
    return (n / 1000000).toFixed(2) + "M";
  }

  var skippedGates = [];

  // Re-applied after every reset: a skipped gate is a fact about the feature's
  // track, not about how much of the log has been applied.
  function applySkipped() {
    skippedGates.forEach(function (g) {
      var pill = gateRailEl.querySelector('.gate-pill[data-gate="' + g + '"]');
      if (!pill) return;
      pill.className = "gate-pill skipped";
      pill.textContent = g + " · skipped";
    });
  }

  function resetAll() {
    Object.keys(DESKS).forEach(function (id) {
      var d = DESKS[id];
      d.state = "idle"; d.activeNow = false; d.completed = false; d.hasOpenIssue = false;
      d.stalled = false; d.blocked = false; d.blockedWhy = null; d.waitingOn = null;
      d.log = []; d.totalRealMs = 0; d.liveSince = null; d.lastGate = null;
    });
    phaseTotals = {};
    gateRailEl.querySelectorAll(".gate-pill").forEach(function (p) {
      p.className = "gate-pill";
      p.textContent = p.dataset.gate;
    });
    tickerEl.innerHTML = "";
    tickerDay = null;
    statBlocker.textContent = "0"; statMajor.textContent = "0"; statVerified.textContent = "0";
    cycleNumEl.textContent = "1";
    signoffCard.classList.remove("show");
    applySkipped();
    floorCaptionEl.innerHTML = "warming up the floor&hellip;";
    stepIndex = -1;
  }

  // `at` is the event's own epoch ms, as recorded in history/events.jsonl. The
  // feed reports when the thing actually happened, never when the page drew it.
  // A line with no recorded time reads "--:--:--" rather than borrowing the
  // clock — an invented timestamp is worse than a visibly missing one.
  function addTickerLine(kind, who, text, at) {
    var row = document.createElement("div");
    row.className = "ticker-row" + (kind === "bad" ? " sev-bad" : "");
    var t = (typeof at === "number" && isFinite(at)) ? new Date(at) : null;
    var day = t ? t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0") : null;
    if (day && day !== tickerDay) {
      tickerDay = day;
      var sep = document.createElement("div");
      sep.className = "ticker-day";
      sep.textContent = "— " + day + " —";
      tickerEl.appendChild(sep);
    }
    var stamp = "--:--:--";
    if (t) {
      stamp = String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0") +
        ":" + String(t.getSeconds()).padStart(2, "0");
      row.title = t.toString();
    } else {
      row.title = "this event carried no timestamp in history/events.jsonl";
    }
    row.innerHTML =
      '<span class="t">' + stamp + '</span>' +
      '<span class="b ' + kind + '"></span>' +
      '<span class="m"><span class="agent">' + who + '</span> ' + text + '</span>';
    tickerEl.appendChild(row);
    scrollFeedToEnd();
    // A divider always precedes the rows it labels, so trimming from the head
    // can drop one; the rows that survive simply carry no day label, which is
    // what the feed did before day labels existed.
    while (tickerEl.children.length > 60) tickerEl.removeChild(tickerEl.firstChild);
  }

  // The feed lives inside a tab body, and that is what scrolls — setting
  // scrollTop on the ticker itself would move nothing. While the pane is hidden
  // its scrollHeight is 0, so the assignment is a no-op and the feed would open
  // parked on its oldest line; the tab switch calls this again once the pane is
  // on screen and can actually be scrolled.
  function scrollFeedToEnd() {
    // Which element actually scrolls depends on the layout: the tab body in the
    // desktop split, the whole panel column once it stacks and the body grows to
    // its content. Walk up to the first ancestor that can scroll — setting
    // scrollTop on one that cannot move is what left the feed parked on an old
    // line while new events piled up below the fold.
    var node = tickerEl.parentElement;
    while (node) {
      // Hidden means the feed tab is not the selected one. Nothing to scroll,
      // and scrolling an ancestor would yank a reader off the board tab.
      if (node.hidden) return;
      if (node.scrollHeight > node.clientHeight + 1) {
        node.scrollTop = node.scrollHeight;
        return;
      }
      if (node.tagName === "ASIDE") return;
      node = node.parentElement;
    }
  }

  function setGate(name, cls) {
    if (!name) return;
    if (skippedGates.indexOf(name) > -1) return;
    var pill = gateRailEl.querySelector('.gate-pill[data-gate="' + name + '"]');
    if (pill) pill.className = "gate-pill " + cls;
  }

  // Only called when a gate actually finishes — appends its accumulated phase
  // duration to the pill so "how long did this phase take" is visible without a
  // click. Pending/active gates stay unlabeled since they have no final duration.
  function markGateDone(name, cls) {
    var pill = gateRailEl.querySelector('.gate-pill[data-gate="' + name + '"]');
    if (!pill) return;
    pill.className = "gate-pill " + cls;
    pill.textContent = name + " · " + fmtDuration(phaseTotals[name] || 0);
  }

  // "real" is a {deskId: ms} map from the builder. The demo's single number is
  // still accepted so a hand-written step keeps working.
  function realFor(s, deskId) {
    if (typeof s.real === "number") return s.real || 0;
    return (s.real && s.real[deskId]) || 0;
  }

  function stepRealTotal(s) {
    if (typeof s.real === "number") return s.real || 0;
    if (!s.real) return 0;
    // Wall-clock, not summed agent-time: concurrent desks in one step waited
    // once, together. Summing them here would inflate every phase with a fan-out.
    return Math.max.apply(null, [0].concat(Object.keys(s.real).map(function (k) { return s.real[k] || 0; })));
  }

  function applyStep(s) {
    // Only the desks in THIS step are "active now" — everyone else keeps whatever
    // sticky state they already earned (completed / hasOpenIssue), which is what
    // lets finished work stay visibly lit as the floor fills up.
    Object.keys(DESKS).forEach(function (id) { DESKS[id].activeNow = false; });
    s.desks.forEach(function (id) {
      var d = DESKS[id];
      if (!d) return;
      d.activeNow = true;
      d.state = s.state;
      d.totalRealMs += realFor(s, id);
      // A step still in progress has no duration to accrue yet; the desk clocks
      // its own elapsed from the phase_start timestamp instead, so a running
      // agent's time advances on screen rather than reading as zero.
      // A blocked step is open but not working, so it gets no running clock:
      // the desk would otherwise count a person's turnaround as agent time.
      d.liveSince = (s.live && s.state !== "blocked") ? s.startedAt : null;
      if (s.phase) d.lastGate = s.phase;
      if (s.state === "done") { d.completed = true; d.hasOpenIssue = false; }
      if (s.state === "bad") { d.hasOpenIssue = true; }
      // Only ever set here, never cleared: the roster is what clears it, on every
      // push, from the same builder state that decided this step. A question
      // that has since been answered leaves no blocked step behind to replay.
      if (s.state === "blocked") {
        d.blocked = true;
        d.waitingOn = s.blockedOn || d.waitingOn;
        d.blockedWhy = s.blockedWhy || d.blockedWhy;
      }
    });
    if (s.phase) {
      phaseTotals[s.phase] = (phaseTotals[s.phase] || 0) + stepRealTotal(s);
    }
    if (s.gate) {
      var gateCls = s.gateState || (s.state === "bad" ? "bad" : "done");
      markGateDone(s.gate, gateCls);
      // Only a real pass advances the rail — a "bad" mark just flags the gate in
      // place, since the cycle hasn't actually moved on to the next phase yet.
      if (gateCls !== "bad") {
        // The gate this cycle failed on has now passed. Every desk that worked
        // toward it stops flagging an open finding — leaving the flag up would
        // show a fixed blocker as still outstanding, cycles after it was closed.
        Object.keys(DESKS).forEach(function (id) {
          if (DESKS[id].lastGate === s.gate) DESKS[id].hasOpenIssue = false;
        });
        var idx = GATES.indexOf(s.gate);
        // Step past any gate this track skipped, or the rail would park its
        // "active" marker on a phase that is never going to run.
        while (idx > -1 && idx < GATES.length - 1 && skippedGates.indexOf(GATES[idx + 1]) > -1) idx++;
        if (idx > -1 && idx < GATES.length - 1) setGate(GATES[idx + 1], "active");
      }
    }
    if (s.caption) floorCaptionEl.innerHTML = s.caption;
    if (s.ticker) {
      s.ticker.forEach(function (t) {
        addTickerLine(t[0], t[1], t[2], t[3]);
        var deskId = WHO_TO_DESK[t[1]];
        if (deskId && DESKS[deskId]) {
          DESKS[deskId].log.push({ kind: t[0], text: t[2] });
          if (DESKS[deskId].log.length > 10) DESKS[deskId].log.shift();
        }
      });
    }
    if (s.signoff) {
      signoffText.textContent = s.signoff;
      signoffCard.classList.add("show");
    }
    if (s.cycle) cycleNumEl.textContent = String(s.cycle);
    // The counters show the ledger as it stood at this step; applyState then
    // overwrites them with the log's current tally, which is what the floor
    // reports once it has caught up.
    if (s.issuesAt) {
      statBlocker.textContent = String(s.issuesAt.blocker);
      statMajor.textContent = String(s.issuesAt.major);
      statVerified.textContent = String(s.issuesAt.verified);
    }
  }

  function nextStep() {
    // Caught up with the log. Nothing loops and nothing replays — an empty tail
    // means the pipeline has not produced another event yet, which is a true
    // statement about the run.
    if (stepIndex + 1 >= SCRIPT.length) return;
    stepIndex++;
    if (stepIndex === 0) setGate(GATES[0], "active");
    applyStep(SCRIPT[stepIndex]);
  }

  var lastClockTick = 0;

  function tick(now) {
    raf = requestAnimationFrame(tick);
    // Apply everything outstanding in one frame: the floor shows where the
    // pipeline actually is, never a re-enactment of how it got there.
    var guard = 0;
    while (stepIndex + 1 < SCRIPT.length && guard++ < 10000) nextStep();
    // Elapsed clocks advance between pushes. Four times a second is past the
    // resolution anyone reads off a seconds counter and keeps the work off the
    // frame budget.
    if (now - lastClockTick > 250) { lastClockTick = now; updateClocks(); }
    draw(now);
  }

  /* ---- rendering ---- */

  function drawDept(now) {
    ctx.fillStyle = "#171f2b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // floor tile checker — two very close shades read as laid flooring instead
    // of a flat void, without competing with anything drawn on top of it
    for (var ty = 0; ty < canvas.height; ty += TILE) {
      for (var tx = 0; tx < canvas.width; tx += TILE) {
        var odd = ((Math.round(tx / TILE) + Math.round(ty / TILE)) % 2) === 0;
        ctx.fillStyle = odd ? "rgba(255,255,255,0.014)" : "rgba(255,255,255,0.03)";
        ctx.fillRect(tx, ty, TILE, TILE);
      }
    }

    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.lineWidth = 1;
    for (var gx = 0; gx <= canvas.width; gx += TILE) {
      ctx.beginPath(); ctx.moveTo(gx + 0.5, 0); ctx.lineTo(gx + 0.5, canvas.height); ctx.stroke();
    }
    for (var gy = 0; gy <= canvas.height; gy += TILE) {
      ctx.beginPath(); ctx.moveTo(0, gy + 0.5); ctx.lineTo(canvas.width, gy + 0.5); ctx.stroke();
    }

    ctx.font = "13px 'Silkscreen', monospace";
    ctx.fillStyle = "#7b8dab";
    DEPT_LABELS.forEach(function (d) {
      ctx.fillText(d.text, d.x, d.y);
    });

    Object.keys(DESKS).forEach(function (id) {
      drawDesk(DESKS[id], now, id, id === hoveredDesk);
    });

    // vignette last, over everything, so the edges recede and the lit desks
    // read as the brightest thing on the floor
    ctx.fillStyle = vignetteGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Resolve the four things a desk can look like. "activeNow" (currently in the
  // running step) always wins and gets the bright, animated treatment; otherwise
  // a desk shows the sticky record of what happened to it: resting (finished),
  // issue (finished with an unresolved problem), or idle (never started yet).
  function visualState(desk) {
    // Being in the step on screen only describes the desk better than its own
    // record while that step has it working or flagging something. A step whose
    // runs all stalled still reads "done" — the gate closed — and taking that as
    // the desk's state is what had a desk with no run_complete drawing the
    // finished marker while the roster called it stalled.
    if (desk.activeNow && desk.state === "working") return "working";
    if (desk.activeNow && desk.state === "bad") return "bad";
    // Above every sticky state, including an open finding: a finding is work
    // somebody already knows about, where this is the pipeline standing still
    // until a person comes back to it. It is also the state this floor used to
    // draw as "working", which is the whole reason it ranks here.
    if (desk.blocked) return "blocked";
    // An open finding outranks a stalled run: the blocker is live and someone has
    // to act on it, where the unclosed run is a fact about a session that already
    // ended. The roster still lists the desk under "stalled" either way.
    if (desk.hasOpenIssue) return "issue";
    if (desk.stalled) return "stalled";            // started a run nothing ever closed
    if (desk.activeNow) return desk.state;         // done, this instant
    if (desk.completed) return "resting";
    return "idle";
  }

  var GLOW = { idle: "#3a4658", resting: "#2c6b52", issue: "#6b2f36",
    working: "#ffb545", done: "#5fd3a0", bad: "#ff6b6b", stalled: "#4a3a2a",
    blocked: "#3b3163" };
  var PERSON_TINT = { idle: "#48597a", resting: "#3fa87d", issue: "#c1595f", stalled: "#8a6127",
    blocked: "#8f7ad6" };
  var HEAD_IDLE = "#3a4658", HEAD_LIT = "#e6b98c";
  var OUTLINE = "rgba(9,13,20,0.6)";

  function outline(x, y, w, h) {
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  }

  function drawDesk(desk, now, id, hovered) {
    var x = desk.x, y = desk.y;
    var vis = visualState(desk);
    var w = 40, h = 24;
    var bodyY = y + 28;

    // chair — grounds the sprite and fills the empty gap behind the desk
    ctx.fillStyle = "#222c3b";
    ctx.fillRect(x + 13, bodyY + 20, 14, 10);
    outline(x + 13, bodyY + 20, 14, 10);

    // desk surface
    ctx.fillStyle = "#2b3a4d";
    ctx.fillRect(x, y + 20, w, h);
    ctx.fillStyle = "#3c5170";
    ctx.fillRect(x, y + 20, w, 6);
    outline(x, y + 20, w, h);

    // monitor glow — bright while actively resolving, dim-but-colored once settled
    ctx.fillStyle = GLOW[vis] || GLOW.idle;
    ctx.fillRect(x + 6, y + 6, 28, 14);
    outline(x + 6, y + 6, 28, 14);
    if (vis === "working" || vis === "bad" || vis === "blocked") {
      ctx.globalAlpha = 0.45 + 0.3 * Math.sin(now / 180 + x);
      ctx.fillRect(x + 1, y + 1, 36, 22);
      ctx.globalAlpha = 1;
    }

    // person — present (a colored body, not just idle-grey) for anything but true idle
    var present = vis !== "idle";
    var tint = (vis === "working" || vis === "done" || vis === "bad")
      ? (ROLE_TINT[id] || "#7c8ba0")
      : (PERSON_TINT[vis] || PERSON_TINT.idle);
    var bob = desk.activeNow ? Math.sin(now / 140 + x) * 2 : 0;

    ctx.fillStyle = tint;
    ctx.fillRect(x + 12, bodyY + 8 + bob, 16, 14);        // torso
    outline(x + 12, bodyY + 8 + bob, 16, 14);
    ctx.fillStyle = present ? HEAD_LIT : HEAD_IDLE;
    ctx.fillRect(x + 14, bodyY + bob, 12, 12);            // head
    outline(x + 14, bodyY + bob, 12, 12);

    if (vis === "blocked") {
      // A hand up over the desk: the agent is at its desk and cannot go on. It
      // wins the marker outright — a desk that finished a run and then asked a
      // question is still the desk somebody has to come back to. The stalled
      // desk's "?" is amber above an empty chair; this one is violet and comes
      // with a person, so the two never read alike.
      ctx.fillStyle = "#b9a2ff";
      ctx.fillRect(x + 30, bodyY + 2 + bob, 4, 10);          // arm
      ctx.fillRect(x + 28, bodyY - 6 + bob, 8, 8);           // hand
      outline(x + 28, bodyY - 6 + bob, 8, 8);
      ctx.font = "12px 'Silkscreen', monospace";
      ctx.fillText("?", x + 14, bodyY - 6 + bob);
    } else if (desk.activeNow && desk.state === "working") {
      ctx.fillStyle = "#ffb545";
      var dotPhase = Math.floor(now / 260) % 3;
      for (var i = 0; i < 3; i++) {
        ctx.globalAlpha = i === dotPhase ? 1 : 0.25;
        ctx.fillRect(x + 12 + i * 6, bodyY - 10 + bob, 4, 4);
      }
      ctx.globalAlpha = 1;
    } else if (vis === "resting" || (desk.activeNow && desk.state === "done")) {
      ctx.fillStyle = "#5fd3a0";
      ctx.fillRect(x + 16, bodyY - 12, 8, 4);
    } else if (vis === "stalled") {
      // An empty chair with the monitor still on: the run was never closed.
      ctx.fillStyle = "#8a6127";
      ctx.font = "12px 'Silkscreen', monospace";
      ctx.fillText("?", x + 18, bodyY - 5);
    } else if (vis === "issue" || (desk.activeNow && desk.state === "bad")) {
      ctx.fillStyle = "#ff6b6b";
      ctx.font = "14px 'Silkscreen', monospace";
      ctx.fillText("!", x + 18, bodyY - 5);
    }

    ctx.font = "10px 'Silkscreen', monospace";
    ctx.fillStyle = present ? "#eef2f8" : "#66779a";
    ctx.fillText(desk.short, x - 2, y + 62);

    // A desk the pipeline is about to reach. Nothing in the event log says this —
    // it comes from the gate sequence — and without it the floor can only show
    // what has already happened.
    if (upNextDesks[id] && !desk.activeNow && vis === "idle") {
      ctx.strokeStyle = "rgba(255,181,69,0.45)";
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.strokeRect(x - 10, y - 6, w + 20, 82);
      ctx.setLineDash([]);
      ctx.font = "8px 'Silkscreen', monospace";
      ctx.fillStyle = "#8a6127";
      ctx.fillText("NEXT", x + 2, y - 10);
    }

    if (hovered) {
      ctx.strokeStyle = "#ffb545";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(x - 12, y - 8, w + 24, 86);
      ctx.setLineDash([]);
    }
  }

  function draw(now) { drawDept(now); }

  /* ---- panel tabs ---- */

  var TABS = [
    { btn: "tabBoard", pane: "paneBoard" },
    { btn: "tabAgents", pane: "paneAgents" },
    { btn: "tabFeed", pane: "paneFeed" },
    { btn: "tabGaps", pane: "paneGaps" }
  ];

  TABS.forEach(function (t) {
    document.getElementById(t.btn).addEventListener("click", function () {
      TABS.forEach(function (o) {
        var on = o === t;
        document.getElementById(o.btn).setAttribute("aria-selected", on ? "true" : "false");
        document.getElementById(o.pane).hidden = !on;
      });
      // Now that the pane has a height, park it on the newest line — every
      // append while it was hidden could not scroll it.
      if (t.pane === "paneFeed") scrollFeedToEnd();
    });
  });

  /* ---- click-to-inspect ---- */

  function canvasPoint(evt) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (evt.clientX - rect.left) * (canvas.width / rect.width),
      y: (evt.clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function deskAt(px, py) {
    // Box height must stay under the department row spacing (dy*1.3*TILE = 67.6px
    // at the current TILE) or adjacent rows' hit-boxes overlap and a click near
    // the boundary can resolve to the wrong desk.
    var found = null;
    Object.keys(DESKS).forEach(function (id) {
      var d = DESKS[id];
      if (px >= d.x - 12 && px <= d.x + 52 && py >= d.y - 4 && py <= d.y + 60) found = id;
    });
    return found;
  }

  var DEPT_LABEL_BY_ID = {};
  DEPARTMENTS.forEach(function (dept) {
    dept.desks.forEach(function (d) { DEPT_LABEL_BY_ID[d.id] = dept.label; });
  });

  var modalEl = document.getElementById("agentModal");
  var modalId = document.getElementById("modalId");
  var modalDept = document.getElementById("modalDept");
  var modalStatus = document.getElementById("modalStatus");
  var modalNow = document.getElementById("modalNow");
  var modalTime = document.getElementById("modalTime");
  var modalLog = document.getElementById("modalLog");
  var modalTask = document.getElementById("modalTask");
  var modalTokens = document.getElementById("modalTokens");

  var STATUS_COPY = {
    working: { cls: "st-working", text: "working" },
    done:    { cls: "st-resting", text: "just finished" },
    bad:     { cls: "st-issue",   text: "flagged an issue" },
    resting: { cls: "st-resting", text: "done — resting" },
    stalled: { cls: "st-issue",   text: "stalled" },
    blocked: { cls: "st-blocked", text: "waiting on an answer" },
    issue:   { cls: "st-issue",   text: "unresolved issue" },
    idle:    { cls: "st-idle",    text: "not started yet" }
  };

  function openAgentModal(id) {
    var d = DESKS[id];
    if (!d) return;
    var vis = visualState(d);
    var status = STATUS_COPY[vis] || STATUS_COPY.idle;

    modalId.textContent = id;
    modalDept.textContent = DEPT_LABEL_BY_ID[id] || d.dept;
    modalStatus.className = "modal-status " + status.cls;
    modalStatus.textContent = status.text;
    var rosterRow = rosterByDesk[id] || null;
    // activeNow means "in the step the floor is currently showing", which is not
    // the same as working: the last step applied is usually a finished one. Only
    // a desk whose own state is "working" is working.
    modalNow.textContent = vis === "blocked"
      ? "waiting on " + ((rosterRow && rosterRow.waitingOn) || "an answer") + " — " +
        ((rosterRow && rosterRow.blockedWhy) || "a question nobody has answered yet") +
        (rosterRow && rosterRow.blockedSource ? " (" + rosterRow.blockedSource + ")" : "")
      : d.activeNow
      ? (d.state === "working"
          ? ((rosterRow && rosterRow.task ? rosterRow.task + " — " : "") + "working now")
          : d.state === "bad"
            ? "just finished this run, and left an open finding."
            : "just finished this run.")
      : (vis === "resting" ? "finished its part — waiting for the rest of the cycle."
        : vis === "issue" ? "left an open finding — waiting on a fix."
        : rosterRow && rosterRow.status === "stalled"
          ? "started a run that was never closed — " + (rosterRow.stalledWhy || "no run_complete was ever recorded") + "."
        : rosterRow && rosterRow.status === "queued"
          ? "hasn't run yet — its gate is still ahead."
          : "its gate has already passed or been skipped; it is not going to run.");
    // The roster row is the builder's own tally for this desk — every run it has
    // made in this feature, not just the step currently on screen.
    var r = rosterByDesk[id] || null;
    var worked = r ? r.totalMs : d.totalRealMs;
    modalTime.textContent = worked > 0
      ? fmtDuration(worked) + (r && r.liveSince && !snapshotMode ? " and counting" : "") +
        (r && r.runs > 1 ? " across " + r.runs + " runs" : "")
      // A stalled desk demonstrably started; what it has no figure for is how
      // long it worked, since nothing ever closed the run.
      : (r && r.status === "stalled" ? "unknown — the run was never closed" : "not started yet");
    modalTask.textContent = (r && r.task) ? r.task
      : (r && r.phase) ? r.phase
      : (r && r.status === "queued") ? "queued — " + (r.gate || "no gate") + " has not run yet"
      : "—";
    modalTokens.textContent = r
      ? fmtTokens(r.tokens) +
        (typeof r.tokens === "number" && r.tokensMissing
          ? " · " + r.tokensMissing + " run(s) reported none" : "")
      : "not reported";

    modalLog.innerHTML = "";
    if (!d.log.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "nothing logged yet.";
      modalLog.appendChild(empty);
    } else {
      d.log.forEach(function (entry) {
        var row = document.createElement("div");
        row.className = "entry" + (entry.kind === "bad" ? " bad" : entry.kind === "done" ? " done" : "");
        row.innerHTML = '<span class="b"></span>' + entry.text;
        row.title = "click to expand";
        modalLog.appendChild(row);
      });
    }

    modalDeskId = id;
    modalEl.classList.add("show");
  }

  function closeAgentModal() {
    modalEl.classList.remove("show");
    modalDeskId = null;
  }

  canvas.addEventListener("mousemove", function (evt) {
    var p = canvasPoint(evt);
    var id = deskAt(p.x, p.y);
    hoveredDesk = id;
    canvas.style.cursor = id ? "pointer" : "default";
  });

  canvas.addEventListener("mouseleave", function () {
    hoveredDesk = null;
    canvas.style.cursor = "default";
  });

  canvas.addEventListener("click", function (evt) {
    var p = canvasPoint(evt);
    var id = deskAt(p.x, p.y);
    if (id) openAgentModal(id);
  });

  // Feed lines are clamped on narrow screens; a tap opens one in full. Bound
  // on the container so it covers rows added later, and harmless where the
  // clamp does not apply.
  tickerEl.addEventListener("click", function (evt) {
    var row = evt.target.closest ? evt.target.closest(".ticker-row") : null;
    if (row) row.classList.toggle("open");
  });

  // Bound on the container so it covers entries rendered later.
  modalLog.addEventListener("click", function (evt) {
    var row = evt.target.closest ? evt.target.closest(".entry") : null;
    if (row) row.classList.toggle("open");
  });

  document.getElementById("modalClose").addEventListener("click", closeAgentModal);
  modalEl.addEventListener("click", function (evt) {
    if (evt.target === modalEl) closeAgentModal();
  });
  document.addEventListener("keydown", function (evt) {
    if (evt.key === "Escape" && modalEl.classList.contains("show")) closeAgentModal();
  });

  /* ============================================================
     LIVE SYNC — state.json over fetch, updates over SSE.

     build-floor.mjs owns every derivation (pairing runs, detecting
     concurrency, mapping agents to desks and gates). This file only
     renders what it is handed, which is why a pipeline event shows
     up here without the visualization being regenerated by hand.
     ============================================================ */

  var brandTagEl = document.getElementById("brandTag");
  var protoTagEl = document.getElementById("protoTag");
  var homeLinkEl = document.getElementById("homeLink");
  var featureNameEl = document.getElementById("featureName");
  var status = { kind: "wait", text: "connecting..." };

  // Served from the home screen, this floor lives at /f/<slug>/ and the home is
  // two levels up. A static snapshot opened from disk, or the legacy single-
  // feature root, has no home to go back to, so the link stays hidden there.
  if (/\/f\/[^/]+\/(?:pipeline-floor\.html)?$/.test(window.location.pathname)) homeLinkEl.hidden = false;

  // The feature's own title, from state.json via the builder. Set once per
  // state, so a rename lands without a reload and the tab reads as the feature
  // rather than as one of several identical "Pipeline Floor" tabs.
  function setFeatureName(st) {
    var title = st && st.title && st.title !== st.slug ? st.title : (st && st.slug) || "";
    if (!title) { featureNameEl.hidden = true; document.title = "Pipeline Floor"; return; }
    featureNameEl.innerHTML = "";
    if (st.kind) featureNameEl.appendChild(el("span", "kind", st.kind));
    featureNameEl.appendChild(document.createTextNode(title));
    featureNameEl.title = title + (st.slug ? " (" + st.slug + ")" : "");
    featureNameEl.hidden = false;
    document.title = title + " · Pipeline Floor";
  }

  function setStatus(kind, text) {
    status = { kind: kind, text: text };
    brandTagEl.textContent = (kind === "live" ? "live · " : "") + text;
    brandTagEl.style.color = kind === "live" ? "#5fd3a0" : kind === "bad" ? "#ff6b6b"
      : kind === "blocked" ? "#b9a2ff" : "";
    protoTagEl.textContent = text;
    // The footer tag carries the same words as the header, so it must not carry
    // a different meaning: red for a waiting pipeline reads as "something broke"
    // when nothing has.
    protoTagEl.style.color = kind === "live" ? "#5fd3a0" : kind === "blocked" ? "#b9a2ff" : "";
    protoTagEl.style.borderColor = kind === "live" ? "#245741" : kind === "blocked" ? "#4b3f85" : "";
  }

  function describe(st) {
    if (!st || st.empty) return "no events yet — nothing has run";
    if (st.shipped) return "shipped · " + fmtDuration(st.wallClockMs) + " total";
    var w = st.waiting || {};
    // Said before "running", and said even while another desk works: a pipeline
    // with one desk waiting on a person and one desk building is still a
    // pipeline somebody has to come back to, and that is the half nobody else
    // on this page will mention. Only a blocking question earns this line — a
    // question the asker had a default for did not stop anything.
    if (w.blocking) {
      return (w.onHuman ? "waiting on you" : "waiting on an answer")
        + " · " + w.blockingCount + " open question" + (w.blockingCount === 1 ? "" : "s")
        + (st.running ? " · " + ((st.nowRunning || []).length) + " still working" : "");
    }
    if (st.running) return "pipeline running · " + fmtDuration(st.wallClockMs) + " elapsed";
    return "idle at last event · " + fmtDuration(st.wallClockMs) + " elapsed";
  }

  function applyState(st) {
    lastState = st;
    setFeatureName(st);
    renderNow(st);
    renderBoard(st);
    renderAgents(st);
    renderGaps(st);
    renderFooter(st);
    if (st.empty) {
      floorCaptionEl.innerHTML = "no events in this feature&rsquo;s log yet &mdash; nothing has run.";
      currentLineEl.textContent = "nothing has run yet";
      setStatus("wait", describe(st));
      return;
    }
    // If the prefix already on screen still matches, only the new tail needs
    // applying. If it changed under us (a resumed run re-deriving earlier steps),
    // applying a delta would be wrong — rebuild the floor from scratch.
    skippedGates = st.skippedGates || [];
    applySkipped();
    var appendOnly = SCRIPT.length > 0 && st.steps.length >= SCRIPT.length && !changedInPlace(st.steps);
    SCRIPT = st.steps;
    if (!appendOnly) resetAll();
    applyRosterFlags();
    cycleNumEl.textContent = String(st.cycle || 1);
    // Issue counts are the log's current tally, not something accumulated step
    // by step — an issue opened in cycle 1 and verified in cycle 3 has to read as
    // verified the moment the floor loads.
    var iss = st.issues || { blocker: 0, major: 0, verified: 0 };
    statBlocker.textContent = String(iss.blocker);
    statMajor.textContent = String(iss.major);
    statVerified.textContent = String(iss.verified);
    setStatus((st.waiting && st.waiting.blocking) ? "blocked" : st.running ? "live" : "wait", describe(st));
  }

  /* ============================================================
     PANELS — done, doing, remaining.

     Everything here is rendered from the builder's state: the roster,
     the task board, the gate plan and the token tallies are all
     derived in build-floor.mjs, so this file never has to work out
     what ran or what is left.
     ============================================================ */

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function shortDesk(id) { return (id || "").replace(/^sdlc-/, ""); }

  // Running agents, each with the elapsed time since its own phase_start. The
  // builder cannot tell a running agent from an interrupted one — the log looks
  // identical — so the wording stays "since phase_start", which is true of both.
  function renderNow(st) {
    var live = (st && st.nowRunning) || [];
    var blocked = (st && st.nowBlocked) || [];
    var waiting = (st && st.waiting) || { items: [] };
    nowListEl.innerHTML = "";
    renderWaitingCard(waiting);
    var stalled = (st && st.stalled) || 0;
    var stalledNote = stalled ? " · " + stalled + " stalled" : "";
    // Counted in desks, not open runs: an agent that asked its question, finished
    // its run and stopped leaves nothing open behind it, and it is still the desk
    // somebody has to come back to.
    var stuck = (st && st.blockedDesks) || blocked.length;
    var blockedNote = stuck ? " · " + stuck + " waiting on an answer" : "";
    if (!live.length) {
      currentLineEl.textContent = (stuck
          ? (stuck === 1 ? "1 desk stopped to ask a question"
            : stuck + " desks stopped to ask questions")
        : st && st.shipped ? "shipped — no agent running"
        : (st && !st.empty ? "no agent running at the last event" : "nothing has run yet"))
        + stalledNote;
    } else {
      currentLineEl.textContent = (live.length === 1
        ? "1 agent working" : live.length + " agents working concurrently")
        + blockedNote + stalledNote;
    }
    blocked.forEach(function (r) {
      var row = el("div", "now-row blocked");
      row.appendChild(el("span", "who", shortDesk(r.desk || r.agent)));
      row.appendChild(el("span", "task", "waiting on " + (r.on || "an answer")));
      // Clocked from when the question was asked, not from phase_start: the time
      // a reader cares about is how long the answer has been outstanding.
      var waited = el("span", "el", fmtDuration(r.waitingMs));
      waited.dataset.since = String(r.since);
      row.appendChild(waited);
      nowListEl.appendChild(row);
    });
    live.forEach(function (r) {
      var row = el("div", "now-row");
      row.appendChild(el("span", "who", shortDesk(r.desk || r.agent)));
      row.appendChild(el("span", "task", r.task ? r.task : (r.gate || r.phase)));
      var elapsed = el("span", "el", fmtDuration(r.elapsedMs));
      elapsed.dataset.since = String(r.startedAt);
      row.appendChild(elapsed);
      nowListEl.appendChild(row);
    });
  }

  // Every open question, whoever it is addressed to, with the file it is written
  // in. Shown even when no run is open — the most common shape of a stuck
  // pipeline is an agent that asked, finished its run and stopped, leaving
  // nothing at all in the run brackets to see.
  function renderWaitingCard(w) {
    waitingCardEl.innerHTML = "";
    if (!w || !w.waiting || !(w.items || []).length) {
      waitingCardEl.classList.remove("show");
      return;
    }
    var head = el("span", "k", !w.blocking
      // Open, but the asker had a default and went on. Worth listing, not worth
      // claiming the pipeline stopped over.
      ? "open questions — nothing is blocked on them"
      : w.onHuman
      ? (w.humanCount === 1 ? "waiting on you" : "waiting on you — " + w.humanCount + " questions")
      : "waiting on another desk");
    waitingCardEl.appendChild(head);
    // Blocking questions are always in full: each one is a reason the pipeline
    // stopped. The non-blocking ones — an asker with a default who went on — are
    // folded behind their count. On a long run they outnumber the blocking ones
    // thirty to one, and listed in full they bury both the questions that matter
    // and the running rows below the card.
    var blockingItems = w.items.filter(function (it) { return it.blocking; });
    var openItems = w.items.filter(function (it) { return !it.blocking; });
    var fold = null;
    if (blockingItems.length && openItems.length) {
      fold = el("button", "fold");
      fold.type = "button";
      fold.setAttribute("aria-expanded", String(nonBlockingOpen));
      fold.textContent = (nonBlockingOpen ? "hide " : "show ") + openItems.length
        + " non-blocking question" + (openItems.length === 1 ? "" : "s");
      fold.addEventListener("click", function () {
        nonBlockingOpen = !nonBlockingOpen;
        renderWaitingCard(w);
      });
    }
    var folded = el("div", "folded");
    if (fold && !nonBlockingOpen) folded.hidden = true;
    (fold ? blockingItems : w.items).forEach(function (it) { appendQuestion(waitingCardEl, it); });
    if (fold) {
      waitingCardEl.appendChild(fold);
      openItems.forEach(function (it) { appendQuestion(folded, it); });
      waitingCardEl.appendChild(folded);
    }
    waitingCardEl.classList.add("show");
  }

  var nonBlockingOpen = false;

  function appendQuestion(parent, it) {
    {
      var line = el("span", "q");
      line.textContent = (it.from ? shortDesk(it.from) + " → " : "")
        + (it.human ? "you" : shortDesk(it.to || "someone"))
        + (it.blocking ? "" : " (non-blocking)") + ": " + it.text;
      parent.appendChild(line);
      if (it.source) {
        // A snapshot ages against the moment it was built, not the moment it is
        // opened — a file kept for a week must not claim the question has been
        // open a week longer than it was when the page was written.
        var asOf = (snapshotMode && lastState && lastState.generatedAt) || Date.now();
        var src = el("span", "src", it.source
          + (it.since ? " · " + fmtDuration(Math.max(0, asOf - it.since)) + " ago" : ""));
        parent.appendChild(src);
      }
    }
  }

  // Tasks first — what the work actually is — then every gate still ahead and
  // the desks that will run it. "Up next" is the one thing no event can report:
  // the log records what happened, never what is scheduled.
  function renderBoard(st) {
    boardRowsEl.innerHTML = "";
    var tasks = (st && st.tasks) || [];
    var plan = (st && st.plan) || [];
    var upNext = (st && st.upNext) || [];

    if (tasks.length) {
      boardRowsEl.appendChild(el("div", "group-label", "workplan — " +
        tasks.filter(function (t) { return t.status === "complete"; }).length + " of " + tasks.length + " complete"));
      tasks.forEach(function (t) {
        var row = el("div", "row");
        row.appendChild(el("span", "name", t.id + (t.title ? " — " + t.title : "")));
        var cls = t.status === "complete" ? "done"
          : t.status === "running" ? "working"
          : t.status === "blocked" ? "bad"
          // "unknown" is a task that ran to completion with no record behind it.
          // It is not queued, so it must not wear the queued chip.
          : t.status === "unknown" ? "" : "queued";
        row.appendChild(el("span", "chip " + cls, t.status));
        var bits = [];
        if (t.desk) bits.push(shortDesk(t.desk));
        if (t.ms) bits.push(fmtDuration(t.ms));
        if (typeof t.tokens === "number") bits.push(fmtTokens(t.tokens) + " tokens");
        if (t.dependsOn && t.dependsOn.length) bits.push("after " + t.dependsOn.join(", "));
        if (bits.length) row.appendChild(el("span", "meta", bits.join(" · ")));
        boardRowsEl.appendChild(row);
      });
    }

    boardRowsEl.appendChild(el("div", "group-label", "gates"));
    plan.forEach(function (g) {
      var row = el("div", "row");
      row.appendChild(el("span", "name", g.gate));
      var cls = g.status === "passed" ? "done" : g.status === "failed" ? "bad"
        : g.status === "working" ? "working" : g.status === "blocked" ? "blocked"
        : g.status === "skipped" ? "" : "queued";
      row.appendChild(el("span", "chip " + cls, g.status));
      var bits = [];
      if (g.runs) bits.push(g.runs + (g.runs === 1 ? " run" : " runs"));
      if (g.realMs) bits.push(fmtDuration(g.realMs) + " agent time");
      if (typeof g.tokens === "number") bits.push(fmtTokens(g.tokens) + " tokens");
      if (bits.length) row.appendChild(el("span", "meta", bits.join(" · ")));
      boardRowsEl.appendChild(row);
    });

    if (upNext.length) {
      boardRowsEl.appendChild(el("div", "group-label", "up next"));
      upNext.forEach(function (n, i) {
        var row = el("div", "row");
        row.appendChild(el("span", "name", (i + 1) + ". " + n.gate));
        row.appendChild(el("span", "meta", n.agents.map(shortDesk).join(", ")));
        boardRowsEl.appendChild(row);
      });
    }

    if (!tasks.length && !plan.length) {
      boardRowsEl.appendChild(el("div", "empty-note", "no workplan or gate record yet."));
    }
  }

  // What the floor cannot show honestly on its own, by kind.
  //
  // The builder files each gap under a nature: `unresolved` is the log
  // contradicting itself and somebody can go and fix the logging; `derived` is
  // an inference the floor made and the line says exactly how; `irreducible` is
  // a caveat no log could ever settle. Ordering by that, defects first, is the
  // difference between a disclosure and an alibi.
  function renderGaps(st) {
    gapRowsEl.innerHTML = "";
    if (!st || st.empty) {
      tabGapsEl.textContent = "gaps";
      gapRowsEl.appendChild(el("div", "empty-note", "nothing has run yet, so there is nothing to disclose."));
      return;
    }
    var groups = st.gapGroups || [];
    // An older state.json carries only the flat list. Show it rather than an
    // empty pane that would read as "nothing to disclose".
    if (!groups.length && st.gaps && st.gaps.length) {
      groups = [{ title: "not shown on this floor", nature: "unresolved", count: st.gaps.length, lines: st.gaps }];
    }
    var total = groups.reduce(function (a, g) { return a + g.count; }, 0);
    tabGapsEl.textContent = total ? "gaps · " + total : "gaps";

    if (!total) {
      gapRowsEl.appendChild(el("div", "empty-note",
        "nothing the floor had to infer, and nothing in the log it could not read."));
      return;
    }

    gapRowsEl.appendChild(el("div", "group-label",
      total + (total === 1 ? " thing" : " things") + " this floor cannot show on its own"));

    groups.forEach(function (g) {
      var row = el("div", "row");
      // A group of one is its own statement; the "1 ·" prefix only ever added
      // a number that disagreed with the sentence beneath it — several of these
      // lines are themselves a tally ("7 completed runs carry no token usage").
      row.appendChild(el("span", "name", (g.count > 1 ? g.count + " · " : "") + g.title));
      row.appendChild(el("span", "chip " + g.nature, g.nature));
      var wrap = el("span", "meta");
      (g.lines || []).forEach(function (line) {
        wrap.appendChild(el("div", "gap-line", line));
      });
      row.appendChild(wrap);
      gapRowsEl.appendChild(row);
    });
  }

  // Every desk on the floor: what it did, how long it took, what it cost, and
  // whether the pipeline is still going to reach it.
  function renderAgents(st) {
    agentRowsEl.innerHTML = "";
    var roster = (st && st.roster) || [];
    rosterByDesk = {};
    upNextDesks = {};
    roster.forEach(function (r) { rosterByDesk[r.desk] = r; });
    var next = (st && st.upNext && st.upNext[0]) || null;
    if (next) next.agents.forEach(function (d) { upNextDesks[d] = true; });

    // Blocked first: it is the only group on this list a reader can do something
    // about this minute.
    var ORDER = { blocked: 0, working: 1, stalled: 2, done: 3, queued: 4, idle: 5 };
    var LABEL = { blocked: "waiting on an answer", working: "working",
      stalled: "stalled — started, never closed",
      done: "done", queued: "queued", idle: "not run" };
    var groups = ["blocked", "working", "stalled", "done", "queued", "idle"];
    var any = false;
    groups.forEach(function (g) {
      var rows = roster.filter(function (r) { return r.status === g; })
        .sort(function (a, b) { return (ORDER[a.status] - ORDER[b.status]) || (b.totalMs - a.totalMs); });
      if (!rows.length) return;
      any = true;
      agentRowsEl.appendChild(el("div", "group-label",
        LABEL[g] + " — " + rows.length + (g === "queued" ? " still to run" : "")));
      rows.forEach(function (r) {
        var row = el("div", "row");
        row.appendChild(el("span", "name", shortDesk(r.desk)));
        var cls = r.status === "blocked" ? "blocked"
          : r.status === "working" ? "working" : r.status === "done" ? "done"
          : r.status === "stalled" ? "bad" : r.status === "queued" ? "queued" : "";
        row.appendChild(el("span", "chip " + cls, r.gate || "—"));
        var bits = [];
        if (r.runs) bits.push(r.runs + (r.runs === 1 ? " run" : " runs"));
        if (r.totalMs) bits.push(fmtDuration(r.totalMs) + (r.liveSince && !snapshotMode ? " and counting" : ""));
        bits.push(fmtTokens(r.tokens) + (typeof r.tokens === "number" ? " tokens" : ""));
        // Only worth saying when some runs did report: "not reported" already
        // covers a desk where none of them did.
        if (typeof r.tokens === "number" && r.tokensMissing) {
          bits.push(r.tokensMissing + " run(s) unreported");
        }
        if (r.task) bits.push(r.task);
        // Why the floor calls it stalled rather than working — the log's own
        // reason, not a guess about the agent.
        if (r.stalledWhy) bits.push(r.stalledWhy);
        // What it is waiting on, how long it has been waiting, and where the
        // question is written down — everything needed to go and answer it.
        if (r.status === "blocked") {
          bits.push("waiting on " + (r.waitingOn || "an answer"));
          if (r.blockedSince) {
            var from = (snapshotMode && lastState && lastState.generatedAt) || Date.now();
            bits.push(fmtDuration(Math.max(0, from - r.blockedSince)) + " so far");
          }
          if (r.blockedWhy) bits.push(r.blockedWhy);
          if (r.blockedSource) bits.push(r.blockedSource);
        }
        row.appendChild(el("span", "meta", bits.join(" · ")));
        agentRowsEl.appendChild(row);
      });
    });
    if (!any) agentRowsEl.appendChild(el("div", "empty-note", "no desks have run yet."));
  }

  // A desk whose run was never closed must not read as finished. The step that
  // carried it is not live, so without this the desk would settle into the
  // resting look and claim work that was never accounted for.
  function applyRosterFlags() {
    Object.keys(DESKS).forEach(function (id) {
      var r = rosterByDesk[id];
      DESKS[id].stalled = !!(r && r.status === "stalled");
      // Blocked is a fact about the desk, not about the step on screen: the run
      // that asked the question may have finished cycles ago and the answer
      // still be outstanding. Without this the desk settles into the resting
      // look and the floor stops saying anybody is waiting.
      DESKS[id].blocked = !!(r && r.status === "blocked");
      DESKS[id].blockedWhy = r ? r.blockedWhy : null;
      DESKS[id].waitingOn = r ? r.waitingOn : null;
    });
  }

  function renderFooter(st) {
    if (!st || st.empty) {
      outElapsed.textContent = outAgentTime.textContent = outTokens.textContent = outRuns.textContent = "—";
      return;
    }
    outElapsed.textContent = fmtDuration(st.wallClockMs || 0);
    // Sum of every agent's own duration, which is larger than elapsed whenever
    // anything ran concurrently. Never conflate the two (protocol section 3).
    outAgentTime.textContent = fmtDuration(st.sumAgentMs || 0);
    var tk = st.tokens || {};
    outTokens.textContent = tk.reportedRuns
      ? fmtTokens(tk.total) + (tk.reportedRuns < tk.totalRuns
        ? " (" + tk.reportedRuns + "/" + tk.totalRuns + " runs reported)" : "")
      : "not reported";
    outRuns.textContent = String(tk.totalRuns || 0);
  }

  // The only thing that moves between pushes: elapsed clocks on running work.
  function updateClocks() {
    if (snapshotMode) return;
    var now = Date.now();
    var rows = nowListEl.querySelectorAll(".el");
    for (var i = 0; i < rows.length; i++) {
      var since = Number(rows[i].dataset.since);
      if (isFinite(since)) rows[i].textContent = fmtDuration(Math.max(0, now - since));
    }
    if (modalDeskId) {
      var r = rosterByDesk[modalDeskId];
      // totalMs already counts the running run up to the moment the state was
      // built; carry it forward from there rather than from phase_start, or the
      // completed runs before it get counted twice.
      if (r && r.liveSince) {
        modalTime.textContent = fmtDuration(r.totalMs +
          Math.max(0, now - (lastState ? lastState.generatedAt : now))) + " and counting" +
          (r.runs > 1 ? " across " + r.runs + " runs" : "");
      }
    }
  }

  // Cheap identity check on the prefix already applied: same desks, same states.
  function changedInPlace(steps) {
    for (var i = 0; i <= stepIndex && i < SCRIPT.length; i++) {
      if (!steps[i]) return true;
      if (steps[i].state !== SCRIPT[i].state) return true;
      if (String(steps[i].desks) !== String(SCRIPT[i].desks)) return true;
    }
    return false;
  }

  function connect() {
    // A file:// page has no server behind it and cannot fetch a sibling file, so
    // the static build inlines its snapshot instead. It is a snapshot, and the
    // header says so rather than implying it is tracking anything.
    if (window.FLOOR_STATE) {
      snapshotMode = true;
      applyState(window.FLOOR_STATE);
      setStatus("wait", "snapshot · " + describe(window.FLOOR_STATE) + " — not tracking");
      return;
    }
    if (!window.EventSource) { pollOnce(); return; }
    stream = new EventSource("stream");
    stream.onmessage = function (evt) {
      try { applyState(JSON.parse(evt.data)); } catch (e) { /* keep the last good state */ }
    };
    stream.onerror = function () {
      // EventSource retries on its own. Closing the handle here was what turned
      // any transient blip — the builder being restarted while the pipeline keeps
      // running, a dropped keep-alive — into a permanently frozen page. Only give
      // up when the browser itself has, which is what readyState CLOSED means.
      if (stream && stream.readyState === EventSource.CLOSED) {
        stream = null;
        setStatus("bad", lastState ? "disconnected — showing the last state received" : "no live server — static snapshot");
        if (!lastState) pollOnce();
        return;
      }
      // Still retrying; say so rather than claiming it is live or dead.
      setStatus("bad", lastState ? "reconnecting…" : "connecting…");
    };
  }

  function pollOnce() {
    fetch("state.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(applyState)
      .catch(function () {
        setStatus("bad", "no state.json — build it with /sdlc-visualize");
        floorCaptionEl.innerHTML = "no floor state found. Run <code>/sdlc-visualize</code> to build it.";
      });
  }

  resetAll();
  setStatus("wait", "connecting...");
  connect();
  raf = requestAnimationFrame(tick);
})();
</script>
